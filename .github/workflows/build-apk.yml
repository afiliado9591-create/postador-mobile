name: Gerar APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Restaurar assinatura debug estável
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: postador-mobile-debug-keystore-v1

      - name: Instalar Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK de teste
        run: gradle :app:assembleDebug --stacktrace

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Postador-Mobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
